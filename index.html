<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>아등바등</title>
    <meta name="description" content="&lt;어두운 바다의 등불이 되어&gt; 팬게임. 4300계단, 180층 꼭대기까지!" />

    <!-- 링크 미리보기 (블루스카이·카톡·X 등에 주소를 붙였을 때 나오는 제목·그림) -->
    <!-- og.png는 index.html 옆(저장소 맨 위)에 둠. 이미지 주소는 전체 주소여야 함 -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nookyyong.github.io/jjumjam/" />
    <meta property="og:title" content="아등바등" />
    <meta property="og:description" content="&lt;어두운 바다의 등불이 되어&gt; 팬게임. 4300계단, 180층 꼭대기까지!" />
    <meta property="og:image" content="https://nookyyong.github.io/jjumjam/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="계단을 오르는 도트 캐릭터들과 꼭대기 EXIT 문" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game_wrapper" id="gameWrapper">
      <!-- 계단 + 캐릭터 + 배경 -->
      <canvas class="game_canvas" id="gameCanvas"></canvas>

      <!-- HUD -->
      <div class="hud hidden" id="hud">
        <div class="hud_item px_box">
          <span class="hud_label">층</span>
          <span class="hud_value" id="floorDisplay">1층</span>
        </div>
        <div class="hud_item wide px_box">
          <span class="hud_label">계단</span>
          <span class="hud_value" id="stairsDisplay">0/4300</span>
        </div>
        <div class="hud_item px_box">
          <span class="hud_label">시간</span>
          <span class="hud_value" id="timeDisplay">0:00</span>
        </div>
      </div>

      <!-- 소리 켜기/끄기 -->
      <div class="sound_toggles" id="soundToggles">
        <button type="button" class="sound_btn px_box" id="sfxBtn" aria-label="효과음 켜기/끄기">
          <span class="sound_icon">♪</span><span class="sound_label">효과음</span>
        </button>
        <button type="button" class="sound_btn px_box" id="bgmBtn" aria-label="배경음 켜기/끄기">
          <span class="sound_icon">♫</span><span class="sound_label">배경음</span>
        </button>
        <!-- 일시정지 (게임 중에만) -->
        <button type="button" class="sound_btn px_box hidden" id="pauseBtn" aria-label="일시정지">
          <span class="sound_icon pause_icon" aria-hidden="true"></span><span class="sound_label">정지</span>
        </button>
      </div>

      <!-- 안내 말풍선 -->
      <div class="toast px_box" id="toast"></div>

      <!-- 터치 조작 (터치 기기에서만 표시, 누르고 있는 동안 이동) -->
      <div class="touch_controls hidden" id="touchControls">
        <button type="button" class="touch_btn" id="touchLeft"><span class="touch_key px_box">◀</span></button>
        <button type="button" class="touch_btn" id="touchRight"><span class="touch_key px_box">▶</span></button>
      </div>

      <!-- 시작(설정) 화면 -->
      <div class="start_screen" id="startScreen">
        <div class="start_card px_box">
          <p class="start_eyebrow">&lt;어두운 바다의 등불이 되어&gt; 팬게임</p>
          <h1 class="start_title" id="startTitle">아등바등</h1>

          <div class="nickname_row">
            <input
              type="text"
              id="nicknameInput"
              class="nickname_input"
              maxlength="12"
              placeholder="닉네임 (1~12자)"
              autocomplete="off"
              spellcheck="false"
              aria-label="닉네임"
            />
          </div>

          <div class="stage_tabs" id="stageTabs" role="tablist" aria-label="스테이지 선택"></div>
          <div class="stage_panel">
            <div class="char_grid" id="charGrid" aria-label="캐릭터 선택"></div>
            <p class="sel_name">
              <small id="stageHint">나머지는 뒤에서 따라와요</small>
            </p>

            <p class="diff_label"><i>▼</i> 난이도 선택 <i>▼</i></p>
            <div class="diff_grid" id="diffGrid" aria-label="난이도 선택"></div>
            <p class="diff_hint" id="diffHint"></p>
          </div>

          <p class="start_error" id="startError"></p>
          <button type="button" class="start_btn px_btn" id="startBtn">오르기 시작</button>
          <p class="mini_help">← → 키 또는 화면 왼쪽/오른쪽을 눌러 이동</p>
        </div>
      </div>

      <!-- 일시정지 화면 -->
      <div class="pause_screen hidden" id="pauseScreen">
        <div class="pause_card px_box">
          <p class="pause_title">일시정지</p>
          <div class="pause_actions">
            <button type="button" class="restart_btn px_btn" id="pauseRestartBtn">다시 오르기</button>
            <button type="button" class="title_btn px_btn" id="quitBtn">처음으로</button>
          </div>
          <p class="mini_help">계속하려면 ▶ 버튼 또는 Esc / P</p>
        </div>
      </div>

      <!-- 결과 화면: 업무용 태블릿 -->
      <div class="gameover_screen hidden" id="gameoverScreen">
        <div class="tablet">
          <div class="tablet_screen">

            <div class="tablet_body">
              <div class="polaroid" id="polaroid">
                <span class="photo_tape"></span>
                <canvas class="photo_canvas" id="photoCanvas" width="240" height="240"></canvas>
                <p class="polaroid_caption" id="photoCaption"></p>
                <span class="photo_stamp" id="photoStamp">1층!</span>
              </div>


              <div class="profile_row">
                <span class="profile_pic"><img id="profileImg" alt="" /></span>
                <div class="profile_info">
                  <div class="profile_head">
                    <span class="profile_char" id="recChar"></span>
                    <b class="profile_name" id="recName"></b>
                  </div>
                  <ul class="profile_stats">
                    <li><span>난이도</span><b id="recMode"></b></li>
                    <li><span>오른 계단</span><b id="recStairs"></b></li>
                    <li><span>소요 시간</span><b id="recTime"></b></li>
                  </ul>
                </div>
              </div>

              <!-- [DB] 랭킹 등록 / 랭킹 탭 (2차 작업) -->
              <div class="tablet_actions">
                <button type="button" class="restart_btn px_btn" id="restartBtn">다시 오르기</button>
                <button type="button" class="title_btn px_btn" id="titleBtn">처음으로</button>
              </div>
              <button type="button" class="save_btn" id="saveBtn">▼ 사진 저장</button>
              <p class="tablet_foot" id="tabletFoot"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="gameLogic.js"></script>

    <!-- 방문 통계 (GoatCounter): 쿠키 없음, 개인 식별 정보 수집 없음
         integrity(SRI): 스크립트 내용이 바뀌면 브라우저가 실행을 막음. 버전 고정 count.v5.js
         MYCODE → 내 GoatCounter 사이트 코드로 바꾸기 -->
    <script data-goatcounter="https://adbd.goatcounter.com/count"
            async src="//gc.zgo.at/count.v5.js"
            crossorigin="anonymous"
            integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>
  </body>
</html>
