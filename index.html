<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>제목지어주세요ㅜㅜ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game_wrapper" id="gameWrapper">
      <!-- 계단 + 캐릭터 + 배경 -->
      <canvas class="game_canvas" id="gameCanvas"></canvas>

      <!-- HUD -->
      <div class="hud hidden" id="hud">
        <div class="hud_item px_box">
          <span class="hud_label">층</span>
          <span class="hud_value" id="floorDisplay">1층</span>
        </div>
        <div class="hud_item wide px_box">
          <span class="hud_label">계단</span>
          <span class="hud_value" id="stairsDisplay">0/4800</span>
        </div>
        <div class="hud_item px_box">
          <span class="hud_label">시간</span>
          <span class="hud_value" id="timeDisplay">0:00</span>
        </div>
      </div>

      <!-- 소리 켜기/끄기 -->
      <div class="sound_toggles" id="soundToggles">
        <button type="button" class="sound_btn px_box" id="sfxBtn" aria-label="효과음 켜기/끄기">
          <span class="sound_icon">♪</span><span class="sound_label">효과음</span>
        </button>
        <button type="button" class="sound_btn px_box" id="bgmBtn" aria-label="배경음 켜기/끄기">
          <span class="sound_icon">♫</span><span class="sound_label">배경음</span>
        </button>
      </div>

      <!-- 안내 말풍선 -->
      <div class="toast px_box" id="toast"></div>

      <!-- 터치 조작 (터치 기기에서만 표시, 누르고 있는 동안 이동) -->
      <div class="touch_controls hidden" id="touchControls">
        <button type="button" class="touch_btn" id="touchLeft"><span class="touch_key px_box">◀</span></button>
        <button type="button" class="touch_btn" id="touchRight"><span class="touch_key px_box">▶</span></button>
      </div>

      <!-- 시작(설정) 화면 -->
      <div class="start_screen" id="startScreen">
        <div class="start_card px_box">
          <p class="start_eyebrow">어두운 바다의 등불이 되어 팬게임</p>
          <h1 class="start_title" id="startTitle">제목지어주세요ㅜㅜ</h1>

          <div class="nickname_row">
            <input
              type="text"
              id="nicknameInput"
              class="nickname_input"
              maxlength="12"
              placeholder="닉네임 (1~12자)"
              autocomplete="off"
              spellcheck="false"
              aria-label="닉네임"
            />
            <span class="player_tag" id="playerTag">#0000</span>
          </div>

          <div class="char_grid" id="charGrid" aria-label="캐릭터 선택"></div>
          <p class="sel_name">
            <small>나머지는 뒤에서 따라와요</small>
          </p>

          <div class="diff_grid" id="diffGrid" aria-label="난이도 선택"></div>

          <p class="start_error" id="startError"></p>
          <button type="button" class="start_btn px_btn" id="startBtn">오르기 시작</button>
          <p class="mini_help">← → 키 또는 화면 왼쪽/오른쪽을 눌러 이동</p>
        </div>
      </div>

      <!-- 결과 화면: 업무용 태블릿 -->
      <div class="gameover_screen hidden" id="gameoverScreen">
        <div class="tablet">
          <div class="tablet_screen">

            <div class="tablet_body">
              <div class="polaroid" id="polaroid">
                <span class="photo_tape"></span>
                <canvas class="photo_canvas" id="photoCanvas" width="240" height="240"></canvas>
                <p class="polaroid_caption" id="photoCaption"></p>
                <span class="photo_stamp" id="photoStamp">1층!</span>
              </div>


              <div class="profile_row">
                <span class="profile_pic"><img id="profileImg" alt="" /></span>
                <div class="profile_text">
                  <b class="profile_name" id="recName"></b>
                  <span class="profile_char" id="recChar"></span>
                </div>
              </div>

              <ul class="record_list">
                <li><span class="record_key">난이도</span><span class="record_val" id="recMode"></span></li>
                <li><span class="record_key">오른 계단</span><span class="record_val" id="recStairs"></span></li>
                <li><span class="record_key">소요 시간</span><span class="record_val" id="recTime"></span></li>
              </ul>

              <!-- [DB] 랭킹 등록 / 랭킹 탭 (2차 작업) -->
              <div class="tablet_actions">
                <button type="button" class="restart_btn px_btn" id="restartBtn">다시 오르기</button>
                <button type="button" class="title_btn px_btn" id="titleBtn">처음으로</button>
              </div>
              <button type="button" class="save_btn" id="saveBtn">▼ 사진 저장 / 공유</button>
              <p class="tablet_foot" id="tabletFoot"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="gameLogic.js"></script>
  </body>
</html>
